- id: test_077
  input: For patient 57, which biomarker has the strongest influence on the logistic regression model's prediction when trained with a 1:5 positive-to-negative ratio, and what generally happens to the depression prediction as that biomarker increases?
  query_log_note: Contains one reproducible Cypher query per searching step; aggregation steps do not issue graph queries.
  queries:
  - query_id: test_077_step_1
    step: 1
    sub_question: For patient 57 in logistic regression trained with a 1:5 positive-to-negative ratio, which biomarker has the largest absolute local SHAP value?
    purpose: Retrieve the biomarker with the strongest patient-specific local influence.
    cypher: |-
      MATCH (p:Patient)-[:HAS_PREDICTION]->(pred:Prediction)-[:EXPLAINED_BY]->(le:LocalExplanation)-[:GENERATED_BY]->(mr:ModelRun)
      MATCH (le)-[fi:FEATURE_IMPORTANCE]->(b:Biomarker)
      WHERE toInteger(p.id) = 57
        AND mr.modelType = 'logisticregression'
        AND mr.classRatio = '1:5'
        AND fi.scope = 'local'
      WITH mr, b, fi
      ORDER BY fi.absShapValue DESC
      WITH collect({model: mr.modelFamily, ratio: mr.classRatio, biomarker: b.name, shap_value: fi.shapValue, abs_shap_value: fi.absShapValue, direction: fi.direction}) AS rows
      WITH rows, rows[0].abs_shap_value AS max_abs
      UNWIND rows AS row
      WITH row, max_abs WHERE row.abs_shap_value = max_abs
      RETURN row.model AS model, row.ratio AS ratio, row.biomarker AS biomarker,
             row.shap_value AS shap_value, row.abs_shap_value AS abs_shap_value, row.direction AS direction
      ORDER BY biomarker
    gold_result:
    - model: Logistic Regression
      ratio: '1:5'
      biomarker: Vitamin D3
      shap_value: -0.179
      abs_shap_value: 0.179
      direction: negative
    validation: gold_result verified by direct execution against the live Neo4j database
    execution_note: Cypher was executed against a live Neo4j Bolt server (bolt://localhost:7687) on 2026-08-17; gold_result reflects the actual query output, including row order as produced by the query's ORDER BY clause.
  - query_id: test_077_step_2
    step: 2
    sub_question: For that biomarker in logistic regression trained with a 1:5 positive-to-negative ratio, as the biomarker value increases, what is the global SHAP tendency for the depression prediction?
