- id: test_015
  input: For patient 7, what does decision tree predict when trained with a 1:1 positive-to-negative ratio, and how does blood mercury affect that prediction?
  query_log_note: Contains one reproducible Cypher query per searching step; aggregation steps do not issue graph queries.
  queries:
  - query_id: test_015_step_1
    step: 1
    sub_question: For patient 7, what prediction does decision tree trained with a 1:1 positive-to-negative ratio make?
    purpose: Retrieve the prediction result for patient 7 from decision tree trained with a 1:1 positive-to-negative ratio.
    cypher: |-
      MATCH (p:Patient)-[:HAS_PREDICTION]->(pred:Prediction)-[:GENERATED_BY]->(mr:ModelRun)
      MATCH (pred)-[pr:PREDICTS]->(c:Condition)
      WHERE toInteger(p.id) = 7
        AND mr.modelType IN ['decisiontree']
        AND mr.classRatio IN ['1:1']
        AND c.name = 'depression'
      RETURN mr.modelFamily AS model, mr.classRatio AS ratio, pr.label AS predicted_label,
             pr.probability AS depression_probability, pred.correct AS correct
      ORDER BY mr.classRatio, model
    gold_result:
    - model: Decision Tree
      ratio: '1:1'
      predicted_label: 1
      depression_probability: 1.0
      correct: false
    validation: gold_result verified by direct execution against the live Neo4j database
    execution_note: Cypher was executed against a live Neo4j Bolt server (bolt://localhost:7687) on 2026-08-17; gold_result reflects the actual query output, including row order as produced by the query's ORDER BY clause.
  - query_id: test_015_step_2
    step: 2
    sub_question: For patient 7 in decision tree trained with a 1:1 positive-to-negative ratio, what is the local SHAP value and direction of blood mercury?
    purpose: Retrieve the patient-specific effect of blood mercury on that prediction.
    cypher: |-
      MATCH (p:Patient)-[:HAS_PREDICTION]->(pred:Prediction)-[:EXPLAINED_BY]->(le:LocalExplanation)-[:GENERATED_BY]->(mr:ModelRun)
      MATCH (le)-[fi:FEATURE_IMPORTANCE]->(b:Biomarker)
      WHERE toInteger(p.id) = 7
        AND mr.modelType IN ['decisiontree']
        AND mr.classRatio IN ['1:1']
        AND b.name IN ['Blood Mercury']
        AND fi.scope = 'local'
      RETURN mr.modelFamily AS model, mr.classRatio AS ratio, b.name AS biomarker,
             fi.shapValue AS shap_value, fi.absShapValue AS abs_shap_value, fi.direction AS direction
      ORDER BY mr.classRatio, model, biomarker
    gold_result:
    - model: Decision Tree
      ratio: '1:1'
      biomarker: Blood Mercury
      shap_value: 0.137
      abs_shap_value: 0.137
      direction: positive
    validation: gold_result verified by direct execution against the live Neo4j database
    execution_note: Cypher was executed against a live Neo4j Bolt server (bolt://localhost:7687) on 2026-08-17; gold_result reflects the actual query output, including row order as produced by the query's ORDER BY clause.
