  input: For naive bayes, which training ratio gives the highest accuracy among 1:1, 1:3, and 1:5 (case 44)?
  query_log_note: Contains one reproducible Cypher query per searching step; aggregation steps do not issue graph queries.
  queries:
  - query_id: test_017_step_1
    step: 1
    sub_question: What is the accuracy of naive bayes trained at 1:1, 1:3, and 1:5?
    purpose: Retrieve the model accuracy for naive bayes at each requested positive-to-negative training ratio.
    cypher: |-
      MATCH (pred:Prediction)-[:GENERATED_BY]->(mr:ModelRun)
      WHERE mr.modelType = 'naivebayes' AND mr.classRatio IN ['1:1', '1:3', '1:5']
