- id: test_119
  input: For patient 40, which biomarker has the strongest influence on the decision tree model's prediction, and what generally happens to the depression prediction as that biomarker increases?
  query_log_note: Contains one reproducible Cypher query per searching step; aggregation steps do not issue graph queries.
  queries:
  - query_id: test_119_step_1
    step: 1
    sub_question: For patient 40 in decision tree trained with a 1:1 positive-to-negative ratio, which biomarker has the largest absolute local SHAP value?
    purpose: Retrieve the biomarker with the strongest patient-specific local influence.
    cypher: |-
      MATCH (p:Patient)-[:HAS_PREDICTION]->(pred:Prediction)-[:EXPLAINED_BY]->(le:LocalExplanation)-[:GENERATED_BY]->(mr:ModelRun)
      MATCH (le)-[fi:FEATURE_IMPORTANCE]->(b:Biomarker)
      WHERE toInteger(p.id) = 40
        AND mr.modelType = 'decisiontree'
        AND mr.classRatio = '1:1'
        AND fi.scope = 'local'
      WITH mr, b, fi
      ORDER BY fi.absShapValue DESC
      WITH collect({model: mr.modelFamily, ratio: mr.classRatio, biomarker: b.name, shap_value: fi.shapValue, abs_shap_value: fi.absShapValue, direction: fi.direction}) AS rows
      WITH rows, rows[0].abs_shap_value AS max_abs
      UNWIND rows AS row
      WITH row, max_abs WHERE row.abs_shap_value = max_abs
      RETURN row.model AS model, row.ratio AS ratio, row.biomarker AS biomarker,
             row.shap_value AS shap_value, row.abs_shap_value AS abs_shap_value, row.direction AS direction
      ORDER BY biomarker
    gold_result:
    - model: Decision Tree
      ratio: '1:1'
      biomarker: Blood Selenium
      shap_value: -0.288
      abs_shap_value: 0.288
      direction: negative
    validation: gold_result verified by direct execution against the live Neo4j database
    execution_note: Cypher was executed against a live Neo4j Bolt server (bolt://localhost:7687) on 2026-08-17; gold_result reflects the actual query output, including row order as produced by the query's ORDER BY clause.
  - query_id: test_119_step_2
    step: 2
    sub_question: For that biomarker in decision tree trained with a 1:1 positive-to-negative ratio, as the biomarker value increases, what is the global SHAP tendency for the depression prediction?
    purpose: Retrieve the global SHAP tendency for that biomarker in the same model setting.
    cypher: |-
      MATCH (mr:ModelRun)-[fi:FEATURE_IMPORTANCE]->(b:Biomarker)
      WHERE mr.modelType IN ['decisiontree']
        AND mr.classRatio IN ['1:1']
        AND fi.scope = 'global'
        AND b.name IN ['Blood Selenium']
      RETURN mr.modelFamily AS model, mr.classRatio AS ratio, b.name AS biomarker,
             fi.influence AS increase_related_tendency
      ORDER BY mr.classRatio, model, biomarker
    gold_result:
    - model: Decision Tree
      ratio: '1:1'
      biomarker: Blood Selenium
      increase_related_tendency: not obvious
