- id: test_019
  input: For the decision tree model, which 2 biomarkers are most important overall, and what happens to the depression prediction as each biomarker increases (case 33)?
  query_log_note: Contains one reproducible Cypher query per searching step; aggregation steps do not issue graph queries.
  queries:
  - query_id: test_019_step_1
    step: 1
    sub_question: For decision tree trained with a 1:1 positive-to-negative ratio, what are the top 2 biomarkers ranked by global SHAP importance, and what is the global SHAP importance of each?
    purpose: Retrieve the global SHAP ranking for the requested model setting.
    cypher: |-
      MATCH (mr:ModelRun)-[s:SHAP_SUMMARY]->(b:Biomarker)
      WHERE mr.modelType IN ['decisiontree']
        AND mr.classRatio IN ['1:1']
        AND (null IS NULL OR b.name IN null)
        AND (2 IS NULL OR s.rankByMeanAbsShap <= 2)
      RETURN mr.modelFamily AS model, mr.classRatio AS ratio, b.name AS biomarker,
             s.rankByMeanAbsShap AS rank, s.meanAbsShap AS global_shap_importance
      ORDER BY mr.classRatio, model, rank, biomarker
    gold_result:
    - model: Decision Tree
      ratio: '1:1'
      biomarker: Vitamin D3
      rank: 1
      global_shap_importance: 0.10971379310344835
    - model: Decision Tree
      ratio: '1:1'
      biomarker: Blood Mercury
      rank: 2
      global_shap_importance: 0.10749310344827591
    validation: gold_result verified by direct execution against the live Neo4j database
    execution_note: Cypher was executed against a live Neo4j Bolt server (bolt://localhost:7687) on 2026-08-17; gold_result reflects the actual query output, including row order as produced by the query's ORDER BY clause.
  - query_id: test_019_step_2
    step: 2
    sub_question: For those top 2 biomarkers in decision tree trained with a 1:1 positive-to-negative ratio, as each biomarker value increases, does its global SHAP tendency increase or decrease the depression prediction?
    purpose: Retrieve the global SHAP tendency for those top-ranked biomarkers.
    cypher: |-
      MATCH (mr:ModelRun)-[fi:FEATURE_IMPORTANCE]->(b:Biomarker)
      WHERE mr.modelType IN ['decisiontree']
        AND mr.classRatio IN ['1:1']
        AND fi.scope = 'global'
        AND b.name IN ['Vitamin D3', 'Blood Mercury']
      RETURN mr.modelFamily AS model, mr.classRatio AS ratio, b.name AS biomarker,
             fi.influence AS increase_related_tendency
      ORDER BY mr.classRatio, model, biomarker
    gold_result:
    - model: Decision Tree
      ratio: '1:1'
      biomarker: Blood Mercury
      increase_related_tendency: negative
    - model: Decision Tree
      ratio: '1:1'
      biomarker: Vitamin D3
      increase_related_tendency: negative
