- id: test_001
  input: For patient 212, how does blood mercury's influence differ across naive bayes and decision tree? Compare both direction and strength.
  query_log_note: Contains one reproducible Cypher query per searching step; aggregation steps do not issue graph queries.
  queries:
  - query_id: test_001_step_1
    step: 1
    sub_question: For models trained with a 1:1 positive-to-negative ratio, what local SHAP value and direction does blood mercury have for patient 212 in naive bayes and decision tree?
    purpose: Retrieve the local SHAP value for blood mercury for patient 212 in each requested algorithm trained with a 1:1 positive-to-negative ratio.
    cypher: |-
      MATCH (p:Patient)-[:HAS_PREDICTION]->(pred:Prediction)-[:EXPLAINED_BY]->(le:LocalExplanation)-[:GENERATED_BY]->(mr:ModelRun)
      MATCH (le)-[fi:FEATURE_IMPORTANCE]->(b:Biomarker)
      WHERE toInteger(p.id) = 212
        AND mr.modelType IN ['naivebayes', 'decisiontree']
        AND mr.classRatio IN ['1:1']
        AND b.name IN ['Blood Mercury']
        AND fi.scope = 'local'
      RETURN mr.modelFamily AS model, mr.classRatio AS ratio, b.name AS biomarker,
             fi.shapValue AS shap_value, fi.absShapValue AS abs_shap_value, fi.direction AS direction
      ORDER BY mr.classRatio, model, biomarker
    gold_result:
    - model: Decision Tree
      ratio: '1:1'
      biomarker: Blood Mercury
      shap_value: 0.032
      abs_shap_value: 0.032
      direction: positive
    - model: Naive Bayes
      ratio: '1:1'
      biomarker: Blood Mercury
      shap_value: 0.0
      abs_shap_value: 0.0
      direction: neutral
    validation: gold_result verified by direct execution against the live Neo4j database
    execution_note: Cypher was executed against a live Neo4j Bolt server (bolt://localhost:7687) on 2026-08-17; gold_result reflects the actual query output, including row order as produced by the query's ORDER BY clause.
- id: test_002
  input: For patient 225, how does the naive bayes model's predicted probability of depression change when its training ratio varies across 1:2, 1:4, and 1:5?
  query_log_note: Contains one reproducible Cypher query per searching step; aggregation steps do not issue graph queries.
  queries:
  - query_id: test_002_step_1
    step: 1
    sub_question: What depression probability does naive bayes predict for patient 225 when trained with positive-to-negative ratios of 1:2, 1:4, and 1:5?
    purpose: Retrieve the depression probabilities predicted for patient 225 by naive bayes trained under each requested positive-to-negative ratio.
    cypher: |-
      MATCH (p:Patient)-[:HAS_PREDICTION]->(pred:Prediction)-[:GENERATED_BY]->(mr:ModelRun)
      MATCH (pred)-[pr:PREDICTS]->(c:Condition)
      WHERE toInteger(p.id) = 225
        AND mr.modelType IN ['naivebayes']
        AND mr.classRatio IN ['1:2', '1:4', '1:5']
        AND c.name = 'depression'
      RETURN mr.modelFamily AS model, mr.classRatio AS ratio, pr.label AS predicted_label,
             pr.probability AS depression_probability, pred.correct AS correct
      ORDER BY mr.classRatio, model
    gold_result:
    - model: Naive Bayes
      ratio: '1:2'
      predicted_label: 0
      depression_probability: 0.259
      correct: true
    - model: Naive Bayes
      ratio: '1:4'
      predicted_label: 0
      depression_probability: 0.123
      correct: true
    - model: Naive Bayes
      ratio: '1:5'
      predicted_label: 0
      depression_probability: 0.068
      correct: true
    validation: gold_result verified by direct execution against the live Neo4j database
    execution_note: Cypher was executed against a live Neo4j Bolt server (bolt://localhost:7687) on 2026-08-17; gold_result reflects the actual query output, including row order as produced by the query's ORDER BY clause.
