- id: test_012
  input: For logistic regression, which training ratio gives the highest accuracy among 1:2, 1:3, 1:4, and 1:5?
  query_log_note: Contains one reproducible Cypher query per searching step; aggregation steps do not issue graph queries.
  queries:
  - query_id: test_012_step_1
    step: 1
    sub_question: What is the accuracy of logistic regression trained at 1:2, 1:3, 1:4, and 1:5?
    purpose: Retrieve the model accuracy for logistic regression at each requested positive-to-negative training ratio.
    cypher: |-
      MATCH (pred:Prediction)-[:GENERATED_BY]->(mr:ModelRun)
      WHERE mr.modelType = 'logisticregression' AND mr.classRatio IN ['1:2', '1:3', '1:4', '1:5']
      RETURN mr.classRatio AS ratio,
             avg(CASE WHEN pred.correct THEN 1.0 ELSE 0.0 END) AS accuracy,
             count(pred) AS prediction_count
      ORDER BY ratio
